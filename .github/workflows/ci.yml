name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is included because the skill builder has platform-specific
    # lookup and batch-spawning paths; ubuntu covers the plain-PATH case.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Integrity only: proves the committed skills/ still matches MANIFEST.
      # Freshness needs the real orx CLI, which is not installed in this job, so
      # the suite skips that one check here and the job below covers it.
      - name: Verify built skills match MANIFEST
        run: node scripts/sync-skills.mjs --check --offline

      - name: Run tests
        shell: pwsh
        run: |
          # TAP is machine-readable, so a failure can be surfaced as an
          # annotation on the job instead of only inside the log.
          node --test --test-reporter=tap 2>&1 | Tee-Object -FilePath test-output.tap
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path test-output.tap -Pattern '^\s*not ok' |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
          }
          exit $code

  skills-freshness:
    # Opt-in freshness gate: installs the real orx CLI and confirms the committed
    # skills were generated from the current release. Runs on one platform only,
    # because it depends on the upstream install script and network access.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install orx
        run: curl -LsSf https://openresearch.sh/install.sh | sh
      - name: Check skills against the installed orx
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          node scripts/sync-skills.mjs --check
