name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is included because the install path and the `orx.cmd` shim are
    # platform-specific; ubuntu covers the plain-PATH case.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The bundle-mode tests install this package into a throwaway profile, so
      # they skip without pnpm rather than passing vacuously.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          standalone: true

      # The figure cropper shells out to `uv run --isolated`; without uv its
      # tests skip, which is exactly how a cross-platform cropper breaks without
      # anyone noticing. Installing it here makes those tests run for real.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Integrity only: proves the committed skills/ still matches MANIFEST.
      # Freshness needs the real orx CLI, which is not installed in this job, so
      # the suite skips that one check here and the job below covers it.
      - name: Verify built skills match MANIFEST
        run: node scripts/sync-skills.mjs --check --offline

      - name: Run tests
        run: node --test

  skills-freshness:
    # Opt-in freshness gate: installs the real orx CLI and confirms the committed
    # skills were generated from the current release. Runs on one platform only,
    # because it depends on the upstream install script and network access.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install orx
        run: curl -LsSf https://openresearch.sh/install.sh | sh
      - name: Check skills against the installed orx
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          node scripts/sync-skills.mjs --check
